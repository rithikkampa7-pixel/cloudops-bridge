# kube-state-metrics in its "limited privileges" mode: it watches only the
# cloudops-bridge namespace (--namespaces), so a namespaced, read-only Role is
# enough. No ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: cloudops-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  namespace: cloudops-bridge
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: cloudops-bridge
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  namespace: cloudops-bridge
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: cloudops-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
