# Prometheus runs in "monitoring" but only needs to discover pods in
# "cloudops-bridge". A namespaced Role (not a ClusterRole) limits it to that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudops-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: cloudops-bridge
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudops-bridge
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: cloudops-bridge
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudops-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
