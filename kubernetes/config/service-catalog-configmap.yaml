apiVersion: v1
data:
  ticket-api.yaml: |
    # Service catalog entry: the operational handoff contract between the
    # Development team that builds this service and the CloudOps team that runs it.
    # CloudOps Bridge reads this file; nothing here is duplicated in Python code.
    # All teams and names below are fictional.

    service: ticket-api
    description: Fictional ticketing API that sells Adventure Park admission tickets.
    tier: tier-1   # customer-facing; revenue-impacting

    owners:
      application: Ticket Development
      cloudops: CloudOps

    environments:
      - production
      - staging

    dependencies:
      - postgresql   # planned; the service currently keeps inventory in memory

    endpoints:
      health: /health
      readiness: /ready
      metrics: /metrics

    alerts:
      HighErrorRate:
        summary: Elevated rate of HTTP 5xx responses.
        severity:
          production: critical
          staging: warning
        # Who should take first action: "cloudops" (platform/infra) or
        # "development" (application code/logic).
        first_responder: cloudops
        runbook: high-error-rate.md
        suggested_checks:
          - Check application health (GET /health and /ready)
          - Review application logs for new or repeated exceptions
          - Check recent deployments
          - Verify database connectivity
          - Consider rollback if deployment-related

      HighLatency:
        summary: Request latency above normal levels.
        severity:
          production: warning
          staging: info
        first_responder: cloudops
        runbook: null   # no runbook yet; documentation gap is surfaced in the incident
        suggested_checks:
          - Check request volume for a traffic spike (e.g. ticket on-sale event)
          - Check CPU and memory saturation
          - Check dependency (database) response times

      TicketServiceTargetDown:
        summary: Prometheus cannot scrape a ticket-api pod (hung, restarting, or unreachable).
        severity:
          production: warning   # one replica affected; the others keep serving
          staging: info
        # Platform signal first: is the pod hung, restarting, or unreachable?
        first_responder: cloudops
        runbook: ticket-service-target-down.md
        suggested_checks:
          - Check whether Kubernetes already restarted or replaced the pod (RESTARTS, pod age)
          - Check the pod's readiness and liveness state and recent events
          - Read the scrape error on the Prometheus target (timeout vs connection refused)
          - Read the previous container's logs if the pod restarted
          - Confirm the other replica is Ready and serving traffic
          - Check rollout history for a deployment in progress

      TicketServiceRolloutStuck:
        summary: A ticket-api rollout exceeded its progress deadline (new pods are not becoming Ready).
        severity:
          production: warning   # previous pods keep serving (maxUnavailable 0): a failed release, not an outage
          staging: info
        # Platform signal first: is the new version unable to start (image, config,
        # scheduling)? Hand over to Development if the new pods crash on start.
        first_responder: cloudops
        runbook: ticket-service-rollout-stuck.md
        suggested_checks:
          - Check rollout status and the Deployment's Progressing condition and reason
          - Inspect the new ReplicaSet's pods and their waiting reason (e.g. ErrImageNeverPull, CrashLoopBackOff)
          - Review Kubernetes events for the Deployment, ReplicaSets and pods
          - Confirm the previous version's pods are still Ready and serving
          - Compare Argo CD sync status with health status (Synced does not mean Healthy)
          - Check whether the last Git change modified the image; if it caused the failure, recover with git revert
kind: ConfigMap
