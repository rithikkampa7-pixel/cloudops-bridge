    """Ticket on-sale traffic for the Phase 7 autoscaling demonstration.

    Open-loop load: requests are scheduled at the configured rate regardless of
    how fast responses come back, the way independent customers arrive. A fixed
    pool of worker threads executes them (bounded concurrency). If every worker is
    busy when a request is due, that request is counted as `skipped` instead of
    spawning unbounded threads, so any shortfall of the generator itself is
    visible instead of silently lowering the load.

    Every request uses a new connection, so kube-proxy spreads the load and new
    replicas receive traffic as soon as they are Ready.

    Mix: GET /tickets (browsing) and POST /tickets/purchase {"quantity": 1}. No
    invalid requests are sent on purpose.

    Standard library only; runs as a Kubernetes Job (loadtest/ticket-sale-job.yaml):
      python ticket_sale.py --base-url http://ticket-service:8080 \
        --profile normal:20:180,spike:200:300,recovery:20:480
    """

    import argparse
    import json
    import queue
    import random
    import socket
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request
    from collections import Counter, defaultdict


    def parse_profile(text):
        """'normal:20:180,spike:200:300' -> [("normal", 20.0, 180.0), ...]."""
        phases = []
        for part in text.split(","):
            name, rate, seconds = part.strip().split(":")
            rate, seconds = float(rate), float(seconds)
            if not name or rate <= 0 or seconds <= 0:
                raise ValueError(f"invalid phase {part!r}")
            phases.append((name, rate, seconds))
        if not phases:
            raise ValueError("empty profile")
        return phases


    def choose_request(rng, buy_ratio):
        """Return (method, path, json_body). Only valid requests: browse or buy one ticket."""
        if rng.random() < buy_ratio:
            return "POST", "/tickets/purchase", {"quantity": 1}
        return "GET", "/tickets", None


    def classify(exc):
        """Failure category for an exception raised by urlopen."""
        if isinstance(exc, urllib.error.HTTPError):
            return f"http_{exc.code}"
        reason = getattr(exc, "reason", exc)
        if isinstance(exc, (socket.timeout, TimeoutError)) or isinstance(reason, (socket.timeout, TimeoutError)):
            return "timeout"
        if isinstance(reason, (ConnectionError, OSError)) or isinstance(exc, (ConnectionError, OSError)):
            return "connection_error"
        return "other_error"


    def p95(values):
        if not values:
            return None
        ordered = sorted(values)
        return round(ordered[min(len(ordered) - 1, int(len(ordered) * 0.95))] * 1000, 1)


    class Stats:
        """Thread-safe counters per phase and per reporting interval."""

        def __init__(self):
            self.lock = threading.Lock()
            self.phase = defaultdict(Counter)
            self.phase_latency = defaultdict(list)
            self.interval = Counter()
            self.interval_latency = []

        def record(self, phase, outcome, latency=None):
            with self.lock:
                self.phase[phase][outcome] += 1
                self.interval[outcome] += 1
                if latency is not None:
                    self.phase_latency[phase].append(latency)
                    self.interval_latency.append(latency)

        def take_interval(self):
            with self.lock:
                counts, lats = self.interval, self.interval_latency
                self.interval, self.interval_latency = Counter(), []
            return counts, lats


    def summarize(counts, latencies, seconds):
        sent = counts["ok"] + sum(v for k, v in counts.items() if k not in ("ok", "skipped"))
        failures = {k: v for k, v in counts.items() if k not in ("ok", "skipped")}
        return {
            "achieved_rps": round(sent / seconds, 1) if seconds else 0.0,
            "sent": sent,
            "ok": counts["ok"],
            "failed": sum(failures.values()),
            "failures": dict(sorted(failures.items())),
            "skipped_generator_saturated": counts["skipped"],
            "p95_ms": p95(latencies),
        }


    def main(argv=None):
        ap = argparse.ArgumentParser(description=__doc__.splitlines()[0])
        ap.add_argument("--base-url", default="http://ticket-service:8080")
        ap.add_argument("--profile", default="normal:20:180,spike:200:300,recovery:20:480")
        ap.add_argument("--buy-ratio", type=float, default=0.05)
        ap.add_argument("--workers", type=int, default=64)
        ap.add_argument("--timeout", type=float, default=5.0)
        ap.add_argument("--interval", type=float, default=10.0)
        ap.add_argument("--seed", type=int, default=7)
        args = ap.parse_args(argv)

        phases = parse_profile(args.profile)
        rng = random.Random(args.seed)
        stats = Stats()
        tasks = queue.Queue(maxsize=args.workers)

        def worker():
            while True:
                task = tasks.get()
                if task is None:
                    return
                phase, method, path, body = task
                data = json.dumps(body).encode() if body is not None else None
                req = urllib.request.Request(args.base_url + path, data=data, method=method,
                                             headers={"Content-Type": "application/json", "Connection": "close"})
                start = time.monotonic()
                try:
                    with urllib.request.urlopen(req, timeout=args.timeout) as resp:
                        resp.read()
                    stats.record(phase, "ok", time.monotonic() - start)
                except Exception as exc:  # every failure is counted, by category
                    stats.record(phase, classify(exc), time.monotonic() - start)

        threads = [threading.Thread(target=worker, daemon=True) for _ in range(args.workers)]
        for t in threads:
            t.start()

        def emit(record):
            print(json.dumps(record), flush=True)

        emit({"event": "start", "profile": args.profile, "buy_ratio": args.buy_ratio,
              "workers": args.workers, "base_url": args.base_url, "time": time.strftime("%H:%M:%S")})
        phase_windows = []
        for name, rate, seconds in phases:
            phase_start = time.monotonic()
            next_report = phase_start + args.interval
            n = 0
            while True:
                due = phase_start + n / rate
                if due >= phase_start + seconds:
                    break
                now = time.monotonic()
                if now >= next_report:
                    counts, lats = stats.take_interval()
                    emit({"event": "interval", "time": time.strftime("%H:%M:%S"), "phase": name,
                          "target_rps": rate, **summarize(counts, lats, args.interval)})
                    next_report += args.interval
                if due > now:
                    time.sleep(due - now)
                method, path, body = choose_request(rng, args.buy_ratio)
                try:
                    tasks.put_nowait((name, method, path, body))
                except queue.Full:
                    stats.record(name, "skipped")
                n += 1
            phase_windows.append((name, rate, time.monotonic() - phase_start))

        for _ in threads:
            tasks.put(None)
        for t in threads:
            t.join()

        report = {}
        for name, rate, seconds in phase_windows:
            report[name] = {"target_rps": rate, "seconds": round(seconds, 1),
                            **summarize(stats.phase[name], stats.phase_latency[name], seconds)}
        emit({"event": "summary", "time": time.strftime("%H:%M:%S"), "phases": report})
        failed = sum(p["failed"] + p["skipped_generator_saturated"] for p in report.values())
        return 1 if failed else 0


    if __name__ == "__main__":
        sys.exit(main())
