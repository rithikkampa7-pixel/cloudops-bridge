apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudops-bridge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 5s
      # Explicit: the default is 1m, which would make alert timing slow and
      # coarse. 15s matches the scrape interval.
      evaluation_interval: 15s

    # Alert rules come from the prometheus-rules ConfigMap (rules-configmap.yaml).
    rule_files:
      - /etc/prometheus-rules/*.yml

    # Firing and resolved alerts go to Alertmanager through its Service DNS name.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc:9093"]

    scrape_configs:
      # Prometheus's own metrics. Kept as a separate job so ticket-service
      # targets are always selected with job="ticket-service".
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Ticket Service pods, discovered through the Kubernetes API.
      # Prometheus watches pods, so a replacement pod becomes a target within
      # seconds with no config change. Pods are scraped directly on their pod
      # IP (not through the Service), so every replica is scraped separately.
      - job_name: ticket-service
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["cloudops-bridge"]
            selectors:
              - role: pod
                label: app.kubernetes.io/name=ticket-service
        relabel_configs:
          # One target per pod: the container port named "http" (8080).
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          # Skip pods that have no IP yet (Pending) or have finished.
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          # Keep pod identity: inventory is per pod, so we need to know
          # which replica reported which value.
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Per-pod CPU and memory from each node's kubelet (/metrics/resource,
      # the same data metrics-server reads). Needs the ClusterRole in
      # rbac.yaml: nodes list/watch (discovery) + nodes/metrics get.
      # Only two metrics for namespace cloudops-bridge are KEPT; note that
      # this filter limits what is stored, not what the kubelet would let
      # Prometheus read - the permission covers all pods on the node.
      - job_name: kubelet-resource
        scheme: https
        metrics_path: /metrics/resource
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          # LOCAL KIND ONLY: kind's kubelet serving certificates are not signed
          # by the cluster CA. Production: verify against the cluster CA.
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__, namespace]
            regex: (container_cpu_usage_seconds_total|container_memory_working_set_bytes);cloudops-bridge
            action: keep

      # Kubernetes object state (HPA desired/current replicas, Deployment
      # available replicas, pod CPU requests) for namespace cloudops-bridge.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # Argo CD application state (sync and health status of ticket-service)
      # from the application controller's metrics Service. Plain HTTP inside the
      # cluster; Argo CD's own NetworkPolicy allows port 8082 from any namespace,
      # and no RBAC is needed (static target, no Kubernetes discovery).
      # Only argocd_app_info is KEPT: the endpoint also exposes controller
      # internals that nothing here uses.
      - job_name: argocd-metrics
        static_configs:
          - targets: ["argocd-metrics.argocd.svc:8082"]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: argocd_app_info
            action: keep
