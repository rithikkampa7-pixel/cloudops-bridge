apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: cloudops-bridge
  labels:
    app.kubernetes.io/name: ticket-service
    app.kubernetes.io/part-of: cloudops-bridge
spec:
  # No `replicas`: the HorizontalPodAutoscaler (hpa.yaml) owns the replica
  # count (min 2). A replicas field here would be reset by every kubectl apply
  # (and by every Argo CD sync, see gitops/README.md).
  # Report a stuck rollout (for example an image that does not exist) as
  # failed after 120s instead of the 600s default: faster feedback for the
  # local demo. Only the reported status changes; old pods keep serving.
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below 2 ready pods; add at most 1 extra pod during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-service
        app.kubernetes.io/part-of: cloudops-bridge
    spec:
      # uvicorn shuts down in under a second (measured).
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ticket-service
          image: cloudops-bridge-ticket-service:phase8-bad
          # Image exists only inside kind (loaded with `kind load docker-image`);
          # never try a remote registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Delay SIGTERM so the Service stops routing here before uvicorn
            # exits. Without this, rollouts dropped ~4 requests (connection
            # refused) because endpoint removal and SIGTERM happen concurrently.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
