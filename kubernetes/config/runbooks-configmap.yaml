    # High Error Rate

    **Alert:** `HighErrorRate` · **Service:** `ticket-api` · **First responder:** CloudOps
    **Owners:** Ticket Development (application), CloudOps (platform)

    > Environment: local kind cluster `cloudops-bridge`, namespace `cloudops-bridge`, Deployment `ticket-service`. Commands below assume `kubectl` points at `kind-cloudops-bridge`. Command blocks contain no `#` comments, so they paste safely into zsh.

    ## Symptoms

    - A large share of requests return HTTP 5xx (for example, more than 5% over 5 minutes).
    - Customers report failed ticket purchases or pages that won't load.
    - `http_requests_total{status=~"5.."}` rises on `GET /metrics`.

    ## Initial Checks

    Do these first, in this order. Spend about 5 minutes here before going deeper.

    1. **Are the pods up and Ready?** If a pod is not Ready or keeps restarting, the problem is the process or its probes.
    2. **Is it everything or one endpoint?** Compare 5xx counts per `path` in `/metrics`.
    3. **Did something change?** Check rollout history for a deployment in the last hour. This is the most common cause.
    4. **Is a dependency down?** Check database connectivity.

    ## Useful Commands

    Pod state, restart counts, and recent cluster events (newest last):

    ```bash
    kubectl -n cloudops-bridge get pods -l app.kubernetes.io/name=ticket-service -o wide
    kubectl -n cloudops-bridge get events --sort-by=.lastTimestamp
    ```

    Why a specific pod is unhealthy (probe failures, OOMKilled, image errors appear under Events and Last State):

    ```bash
    kubectl -n cloudops-bridge describe pod POD_NAME
    ```

    Application logs. `--previous` shows the container that ran *before the last restart*. It only works if `RESTARTS` is above 0; otherwise it returns `previous terminated container ... not found`:

    ```bash
    kubectl -n cloudops-bridge logs deploy/ticket-service --since=15m
    kubectl -n cloudops-bridge logs POD_NAME --previous
    ```

    Error counts by endpoint and status (run the port-forward in its own tab):

    ```bash
    kubectl -n cloudops-bridge port-forward svc/ticket-service 8080:8080
    ```

    ```bash
    curl -s localhost:8080/health
    curl -s localhost:8080/ready
    curl -s localhost:8080/metrics | grep http_requests_total
    ```

    Incident context (owners, dependencies, checks), with the bridge port-forwarded to 8081:

    ```bash
    curl -s -X POST localhost:8081/incidents/enrich -H 'Content-Type: application/json' -d '{"service":"ticket-api","environment":"production","alert":"HighErrorRate"}'
    ```

    Recent deployments:

    ```bash
    kubectl -n cloudops-bridge rollout history deployment/ticket-service
    ```

    ## Common Causes

    | Cause | Signal |
    |---|---|
    | Bad deployment | Errors start right after a rollout; new pods not Ready |
    | Database unavailable or slow | Errors on write paths (`/tickets/purchase`) only |
    | Resource exhaustion (CPU/memory) | Errors with high traffic; `OOMKilled` in `describe pod`; restarts rising |
    | Misconfiguration | Errors start after a config change |

    ## Recovery

    - **Deployment-related:** roll back first and investigate after (see below).
    - **Dependency down:** restore the dependency. Escalate to its owner if it isn't yours.
    - **Single unhealthy pod:** the liveness probe restarts a hung container automatically. If a pod is stuck, delete it and the Deployment replaces it:

    ```bash
    kubectl -n cloudops-bridge delete pod POD_NAME
    ```

    - **Overloaded:** the HorizontalPodAutoscaler already adds replicas on CPU (2–6 replicas, 70% of the CPU request). Check whether it is scaling, and whether it has reached its maximum:

    ```bash
    kubectl -n cloudops-bridge get hpa ticket-service
    kubectl -n cloudops-bridge describe hpa ticket-service
    ```

    Don't `kubectl scale` the Deployment: the HPA owns the replica count and overrides a manual change on its next decisions (a scale-down after its 300 s stabilization window). If the HPA is at 6 replicas and CPU is still above target, raising `maxReplicas` in `kubernetes/ticket-service/hpa.yaml` is a reviewed configuration change. More replicas won't fix 5xx caused by a bug or a failing dependency.

    ## Rollback

    **Do not run a plain `rollout undo` blindly.** It goes to the *immediately previous* revision. After an earlier rollback, that can be the broken release itself. This happened while testing this runbook: `undo` redeployed a bad image. Check the history, confirm which revision has a known-good image, and roll back to it explicitly:

    ```bash
    kubectl -n cloudops-bridge rollout history deployment/ticket-service
    kubectl -n cloudops-bridge rollout history deployment/ticket-service --revision=REVISION
    kubectl -n cloudops-bridge rollout undo deployment/ticket-service --to-revision=REVISION
    kubectl -n cloudops-bridge rollout status deployment/ticket-service --timeout=120s
    ```

    ## Escalation

    - **Development (Ticket Development):** the cause is application code or business logic, such as new exceptions after a release that a rollback doesn't fix.
    - **CloudOps lead:** the platform, network, or a shared dependency is down, or there's no improvement after 30 minutes.
    - Always include the enriched incident output and the time errors started.

    ## Verification

    - 5xx rate is back to baseline for at least 10 minutes.
    - `kubectl -n cloudops-bridge get deploy ticket-service` shows `2/2` ready, and restart counts are stable.
    - `/health` and `/ready` return 200.
    - A test purchase succeeds: `POST /tickets/purchase` with `{"quantity": 1}`.
    - **Afterward:** add anything new you learned to this runbook.
  ticket-service-rollout-stuck.md: |
    # Ticket Service Rollout Stuck

    **Alert:** `TicketServiceRolloutStuck` · **Service:** `ticket-api` · **First responder:** CloudOps
    **Owners:** Ticket Development (application), CloudOps (platform)

    > Environment: local kind cluster `cloudops-bridge`. Apps run in namespace `cloudops-bridge`; Prometheus and Alertmanager in `monitoring`; Argo CD in `argocd`. Command blocks contain no `#` comments, so they paste safely into zsh. Commands that use `localhost:19090` need the Prometheus port-forward from `kubernetes/monitoring/README.md`.

    ## What the alert means

    The ticket-service Deployment reports `Progressing=False` with reason `ProgressDeadlineExceeded`: a rollout has made no progress for longer than `progressDeadlineSeconds` (120 s in `kubernetes/ticket-service/deployment.yaml`), and the condition has held for a further minute. New pods aren't becoming Ready.

    It does **not** mean the service is down:

    - The strategy is `maxUnavailable: 0`, so Kubernetes keeps the previous version's pods until new ones are Ready. Users are normally still served by the old version.
    - Kubernetes **doesn't roll back on its own**. The stuck rollout stays until the desired state changes.
    - A normal rolling update never triggers this alert. It reports `ReplicaSetUpdated` or `NewReplicaSetAvailable`, never `ProgressDeadlineExceeded`.

    **Synced doesn't mean Healthy.** ticket-service is deployed by Argo CD from Git. After a bad release, Argo CD shows **Synced** (the cluster matches Git) and **Degraded** (the workload isn't working). Git, not the cluster, is where the problem is.

    ## 1. Establish what failed

    Rollout state and the Deployment's conditions:

    ```bash
    kubectl -n cloudops-bridge rollout status deployment/ticket-service --timeout=10s
    kubectl -n cloudops-bridge get deploy ticket-service -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}'
    ```

    ReplicaSets: which one is new, and which image each runs:

    ```bash
    kubectl -n cloudops-bridge get rs -l app.kubernetes.io/name=ticket-service -o wide
    ```

    The failing pods and why they're waiting (`ErrImageNeverPull`, `ErrImagePull`, `CrashLoopBackOff`, `Pending`, failing readiness):

    ```bash
    kubectl -n cloudops-bridge get pods -l app.kubernetes.io/name=ticket-service -o wide
    kubectl -n cloudops-bridge describe pod POD_NAME
    kubectl -n cloudops-bridge get events --sort-by=.lastTimestamp
    ```

    If the reason is an image error, check whether the image exists in the kind node. There's no registry in this project, so every image must be loaded with `kind load docker-image`, and `imagePullPolicy: Never` means it's never pulled:

    ```bash
    docker exec cloudops-bridge-control-plane crictl images | grep ticket-service
    ```

    If the new pods start and then crash, read their logs:

    ```bash
    kubectl -n cloudops-bridge logs POD_NAME --previous
    ```

    Are users still served? The previous version's pods should be the Service's ready endpoints:

    ```bash
    kubectl -n cloudops-bridge get endpointslices -l kubernetes.io/service-name=ticket-service
    kubectl -n cloudops-bridge exec -i deploy/bridge -- python - < kubernetes/tools/smoke_test.py
    ```

    What did Argo CD deploy, and what changed? Compare its sync status with its health status, then look at the last Git change to the manifests:

    ```bash
    kubectl -n argocd get application ticket-service -o jsonpath='sync={.status.sync.status} health={.status.health.status} revision={.status.sync.revision}{"\n"}'
    git log --oneline -5 -- kubernetes/ticket-service/
    git show HEAD -- kubernetes/ticket-service/deployment.yaml
    ```

    ## 2. Decide

    | What you found | Meaning | Action |
    |---|---|---|
    | New pods `ErrImageNeverPull` / `ErrImagePull`; the last commit changed the image tag | The release references an image that isn't in the cluster | Recover through Git (below). Or, if the image should exist, build and `kind load` it; the rollout then continues |
    | New pods `CrashLoopBackOff` or never Ready | The new version fails at startup or on its readiness check | Recover through Git, then hand the logs to Development |
    | New pods `Pending` | Scheduling: not enough CPU or memory on the node | Check `describe pod` events and node capacity. Escalate to the CloudOps lead |
    | Old pods are also not Ready | Not just a failed release: the service is affected | Treat it as an outage. Check `TicketServiceTargetDown` and the smoke test |

    ## 3. Recover through Git

    ticket-service is GitOps-managed. **Don't patch or `kubectl apply` the live Deployment** as the normal fix: Argo CD's self-heal reverts manual changes to Git-managed fields, and Git would still contain the bad release. Revert the change that broke the rollout instead:

    Push to the branch the Application tracks (`targetRevision` in `gitops/ticket-service-application.yaml`):

    ```bash
    git revert BAD_COMMIT
    git push
    ```

    Argo CD deploys the revert when it sees the new commit. To check it now instead of waiting for the next poll, refresh and watch:

    ```bash
    kubectl -n argocd annotate application ticket-service argocd.argoproj.io/refresh=normal --overwrite
    kubectl -n cloudops-bridge rollout status deployment/ticket-service --timeout=180s
    ```

    Argo CD doesn't wait for CI ([gitops/README.md](../gitops/README.md#sync-policy)), so check that the revert's GitHub Actions run passes too.

    ## 4. Escalation

    - **CloudOps lead:** pods `Pending` for capacity reasons, old pods also affected, or no recovery 15 minutes after the revert.
    - **Development (Ticket Development):** new pods crash with application errors.
    - Include the bad commit, the Deployment conditions, the waiting reason of the new pods, and the Argo CD sync and health status.

    ## 5. Verify recovery

    - `kubectl -n cloudops-bridge rollout status deployment/ticket-service` reports `successfully rolled out`, and the Deployment is `2/2` (or the HPA's current count).
    - The Progressing condition reason is `NewReplicaSetAvailable`.
    - Argo CD shows **Synced** and **Healthy** at the revert commit.
    - The alert is gone from Prometheus (`python3 kubernetes/tools/promql.py --rules`) and Alertmanager.
    - The smoke test passes.
    - Record what failed and what fixed it in this runbook.
  ticket-service-target-down.md: |
    # Ticket Service Target Down

    **Alert:** `TicketServiceTargetDown` · **Service:** `ticket-api` · **First responder:** CloudOps
    **Owners:** Ticket Development (application), CloudOps (platform)

    > Environment: local kind cluster `cloudops-bridge`. Apps run in namespace `cloudops-bridge`; Prometheus and Alertmanager in `monitoring`. Command blocks contain no `#` comments, so they paste safely into zsh. Commands that use `localhost:19090` need the Prometheus port-forward from `kubernetes/monitoring/README.md`.

    ## What the alert means

    Prometheus failed to scrape `/metrics` on **one ticket-service pod** for at least 15 seconds (`up{job="ticket-service"} == 0`). The alert labels name the pod (`pod`) and its address (`instance`).

    It does **not** mean the service is down:

    - The other replicas (at least one; the HPA keeps 2–6) usually keep serving.
    - **A pod the HPA has just created** can be scraped once before it listens. That usually clears within one or two scrapes and never reaches `firing`; check the pod's age.
    - Prometheus scrapes each pod directly, independent of Kubernetes readiness. The pod can be NotReady, Ready, or already restarted when you look.
    - **Kubernetes may already be fixing it.** A hung pod is restarted by its liveness probe within about 45 s. Don't restart anything until you know what failed.

    ## 1. Establish what failed

    Is the pod still there, and has it restarted?

    ```bash
    kubectl -n cloudops-bridge get pods -l app.kubernetes.io/name=ticket-service -o wide
    ```

    What does Prometheus see now, and why did the scrape fail? `context deadline exceeded` means the process is hung or slow; `connection refused` means nothing is listening (starting, stopping, or crashed).

    ```bash
    python3 kubernetes/tools/promql.py --targets
    python3 kubernetes/tools/promql.py 'up{job="ticket-service"}'
    ```

    Why did the pod change state? Look for probe failures, `Killing`, OOM, or image errors in the Events, and `Last State` with its exit code (137 = killed):

    ```bash
    kubectl -n cloudops-bridge describe pod POD_NAME
    kubectl -n cloudops-bridge get events --sort-by=.lastTimestamp
    ```

    What was the process doing before it stopped? `--previous` works only if `RESTARTS` is above 0:

    ```bash
    kubectl -n cloudops-bridge logs POD_NAME --previous
    kubectl -n cloudops-bridge logs POD_NAME --since=15m
    ```

    Are users still served? The Service should list at least one ready endpoint, and the smoke test should pass:

    ```bash
    kubectl -n cloudops-bridge get endpointslices -l kubernetes.io/service-name=ticket-service
    kubectl -n cloudops-bridge exec -i deploy/bridge -- python - < kubernetes/tools/smoke_test.py
    ```

    Was a deployment in progress?

    ```bash
    kubectl -n cloudops-bridge rollout status deployment/ticket-service --timeout=10s
    kubectl -n cloudops-bridge rollout history deployment/ticket-service
    ```

    ## 2. Decide

    | What you found | Meaning | Action |
    |---|---|---|
    | `RESTARTS` increased, pod `1/1`, target `UP` again | A hung or crashed process; liveness restarted it | Don't touch it. Read `logs --previous` for the cause and record it. If it repeats, escalate to Development |
    | Pod `0/1` and not recovering, restarts climbing | Crash loop or a dependency problem | Investigate from `describe` and logs. Don't keep restarting it |
    | Pod `1/1` Ready, but the target stays `DOWN` | The app serves users but Prometheus can't reach it: a monitoring-path problem | Check the error text, the Prometheus logs, and the network path from the `monitoring` namespace |
    | Pod `Terminating`, a rollout in progress, alert clears within a minute | A known false positive: a terminating pod stays a scrape target briefly after it stops accepting connections | Confirm the rollout completed and the alert resolved. No action |
    | Pod gone, a replacement `1/1` and `UP` | Replaced (deletion or eviction) | Verify, then find out why it was deleted |

    Restarting a pod is a last resort, used only when it's stuck *and* Kubernetes isn't recovering it. The Deployment replaces it:

    ```bash
    kubectl -n cloudops-bridge delete pod POD_NAME
    ```

    ## 3. Escalation

    - **CloudOps lead:** the target stays `DOWN` while the pod is Ready (monitoring path), every replica is affected, or there's no recovery after 15 minutes.
    - **Development (Ticket Development):** repeated restarts with application errors in `logs --previous`.
    - Include the alert labels (`pod`, `instance`), the scrape error text, and `RESTARTS` and events.

    ## 4. Verify recovery

    - `python3 kubernetes/tools/promql.py --targets` shows both ticket-service targets `UP`.
    - `kubectl -n cloudops-bridge get deploy ticket-service` shows `2/2`.
    - The alert is gone from Prometheus (`python3 kubernetes/tools/promql.py --rules`) and from Alertmanager (`curl -s 'localhost:19093/api/v2/alerts?active=true'` returns `[]`).
    - The smoke test passes.
    - Record what failed and what fixed it in this runbook.
