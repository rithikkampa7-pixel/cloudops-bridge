# Argo CD Application: ticket-service's desired state is
# kubernetes/ticket-service/ (Deployment, Service, HPA) on the main branch of
# this repository.
#
# Sync is AUTOMATED with self-heal: Argo CD applies new commits on its own and
# reverts manual changes to Git-managed fields. Automatic pruning stays OFF:
# removing a file from Git never deletes a live resource. Argo CD does not
# wait for CI, so this is not a CI-gated deployment (see gitops/README.md).
# There is no resources-finalizer, so deleting this Application leaves the
# running service in place.
#
# The HPA owns the replica count (see gitops/README.md). Git never declares
# spec.replicas, and ignoreDifferences + RespectIgnoreDifferences make sure
# neither a diff nor a sync touches the replica count the HPA has set.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: cloudops-bridge
spec:
  project: cloudops-bridge
  source:
    repoURL: https://github.com/rithikkampa7-pixel/cloudops-bridge.git
    targetRevision: main
    path: kubernetes/ticket-service
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-bridge
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ticket-service
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
    syncOptions:
      # The namespace is created by the Quick start, not by Argo CD.
      - CreateNamespace=false
      # Apply ignoreDifferences during sync as well, not only when diffing.
      - RespectIgnoreDifferences=true
