apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudops-bridge
data:
  # Single source of truth for alert rules. Validated and unit-tested with
  # promtool by kubernetes/monitoring/validate-alerting.sh.
  #
  # Label contract (consumed by CloudOps Bridge via the Alertmanager webhook):
  #   alertname   - matches an alert in service-catalog/<service>.yaml where one exists
  #   service     - the catalog's `service` value
  #   environment - one of the catalog's `environments`
  #   severity    - routing hint for Alertmanager
  ticket-service.yml: |
    groups:
      - name: ticket-service
        rules:
          # Prometheus cannot scrape a ticket-service pod: the process is hung,
          # crashed, or unreachable from Prometheus. Per pod (keeps pod/instance).
          # Only job="ticket-service": Prometheus's own target is out of scope.
          #
          # for: 15s is a DEMO value. Kubernetes restarts a hung pod within
          # ~45-60s, so a production-style 2-5m would never fire here - which is
          # exactly what production wants (a self-healing blip should not page).
          - alert: TicketServiceTargetDown
            expr: up{job="ticket-service"} == 0
            for: 15s
            labels:
              severity: warning
              service: ticket-api
              environment: production
            annotations:
              summary: "Prometheus cannot scrape ticket-service pod {{ $labels.pod }}"
              description: >-
                Scrapes of {{ $labels.instance }} (pod {{ $labels.pod }}) have failed
                for at least 15s. The pod may be hung, restarting, or unreachable.
                Kubernetes readiness is a separate signal: check the pod as well.

          # Server-side failure rate: share of application requests answered
          # with 5xx. 4xx (validation 422, sold out 409, unknown URL 404) are
          # correct rejections, not failures, so they never count.
          # Probes (/health, /ready) and scrapes (/metrics) are excluded from
          # both sides, as on the dashboard.
          #   numerator:   5xx request rate over 2m
          #   denominator: all application request rate over 2m
          #   threshold:   > 5%, only while traffic > 0.1 req/s (a lone failed
          #                request at near-zero traffic is not a 100% outage)
          #   for:         1m sustained
          # No 5xx series -> empty numerator -> no alert. No traffic -> 0/0 =
          # NaN -> comparison false -> no alert. Demo values; production values
          # would come from the service's SLO (e.g. error-budget burn rate).
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{job="ticket-service",status=~"5..",path!~"/health|/ready|/metrics"}[2m]))
                /
                sum(rate(http_requests_total{job="ticket-service",path!~"/health|/ready|/metrics"}[2m]))
              ) > 0.05
              and
              sum(rate(http_requests_total{job="ticket-service",path!~"/health|/ready|/metrics"}[2m])) > 0.1
            for: 1m
            labels:
              severity: critical
              service: ticket-api
              environment: production
            annotations:
              summary: "ticket-api is returning server errors (5xx)"
              description: >-
                {{ $value | humanizePercentage }} of application requests returned 5xx
                over the last 2 minutes (threshold 5%, sustained 1m).

          # A ticket-service rollout has stopped making progress: the Deployment
          # reports Progressing=False with reason ProgressDeadlineExceeded
          # (kube-state-metrics). Kubernetes sets this only after
          # progressDeadlineSeconds (120s in deployment.yaml) without progress,
          # so a normal rolling update, which reports ReplicaSetUpdated or
          # NewReplicaSetAvailable, never matches.
          # for: 1m confirms it across 4 evaluations, so it fires about 3 minutes
          # after the stuck rollout began. warning, not critical: with
          # maxUnavailable 0 the previous pods keep serving, so this is a failed
          # release, not an outage (verified in the Phase 8 bad-release test).
          - alert: TicketServiceRolloutStuck
            expr: |
              kube_deployment_status_condition{namespace="cloudops-bridge",deployment="ticket-service",condition="Progressing",status="false",reason="ProgressDeadlineExceeded"} == 1
            for: 1m
            labels:
              severity: warning
              service: ticket-api
              environment: production
            annotations:
              summary: "ticket-service rollout is stuck (ProgressDeadlineExceeded)"
              description: >-
                Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has made no
                rollout progress for longer than its progress deadline: new pods are not
                becoming Ready. With maxUnavailable 0 the previous pods normally keep
                serving. Check the new ReplicaSet's pods and events, and compare Argo CD
                sync and health status.
              runbook: ticket-service-rollout-stuck.md
